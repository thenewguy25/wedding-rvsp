<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Avery 95348 — Duplex (2-page, front+back)</title>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 8.5in; }

  .sheet {
    position: relative;
    width: 8.5in;
    height: 11in;
    page-break-after: always;
  }
  .sheet:last-child { page-break-after: auto; }

  .box {
    position: absolute;
    left: 0.75in;
    width: 7in;
    height: 5in;
    outline: 1px dashed #bbb; /* Avery die-cut guide — fine to leave for a test print */
    overflow: hidden;
  }
  .box1 { top: 0.5in; }
  .box2 { top: 5.5in; }

  .card-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5in;
    height: 7in;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  /* Back pass is rotated the opposite way to correct a 180deg flip
     confirmed by a real test print (front was right-side up, back
     came out upside down after duplex printing). */
  .card-wrap.back { transform: translate(-50%, -50%) rotate(-90deg); }

  iframe {
    width: 5in;
    height: 7in;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <!-- Page 1: front of the card -->
  <div class="sheet">
    <div class="box box1"><div class="card-wrap"><iframe src="front-vector.html"></iframe></div></div>
    <div class="box box2"><div class="card-wrap"><iframe src="front-vector.html"></iframe></div></div>
  </div>

  <!-- Page 2: back of the card -->
  <div class="sheet">
    <div class="box box1"><div class="card-wrap back"><iframe src="back-vector.html"></iframe></div></div>
    <div class="box box2"><div class="card-wrap back"><iframe src="back-vector.html"></iframe></div></div>
  </div>
</body>
</html>
